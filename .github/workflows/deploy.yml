name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The workflow token is not permitted to create the Pages site on this repo
# (actions/configure-pages returns "Resource not accessible by integration"),
# so we publish the built site to the gh-pages branch instead. Pages must be
# pointed at that branch once, by hand:
#   Settings -> Pages -> Source: "Deploy from a branch" -> gh-pages / (root)
# After that one-time step every push to main redeploys automatically.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
